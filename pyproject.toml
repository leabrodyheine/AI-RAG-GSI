[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orswater"
version = "0.1.0"
description = "RAG prototype answering Oregon water law questions from the Oregon Revised Statutes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.13",
    # Verified: lxml 5.2's libxml2 silently drops some malformed paragraphs in the
    # real ORS chapter 537 page (undercounts by ~1100 of 2707 <p> tags); 6.1
    # parses it completely. Pin the floor to the version actually verified against.
    "lxml>=6.1",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Verified: the >=0.49 floor was provisional. The search_result content-block and
    # citations API this prototype uses is confirmed present, non-beta, in 1.5.0.
    "anthropic>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
orswater = "orswater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orswater"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
