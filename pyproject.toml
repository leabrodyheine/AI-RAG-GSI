[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orswater"
version = "0.1.0"
description = "RAG prototype answering Oregon water law questions from the Oregon Revised Statutes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.49",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
orswater = "orswater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orswater"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
