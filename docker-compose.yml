services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orswater
      POSTGRES_PASSWORD: orswater
      POSTGRES_DB: orswater
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orswater -d orswater"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
